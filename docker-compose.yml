version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/mistral-7b-instruct-v0.1.Q4_K_M.gguf
      - API_BASE_URL=https://iuc-api-aca.bitang.net/api
      - ApiKey=iuc3783XX19ezUNRD884296Pc
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - DB_TYPE=sqlite
      - N8N_ENCRYPTION_KEY=your-encryption-key-here
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflow.json:/data/workflow.json:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8080:8080"
    volumes:
      - ./UI:/app/UI
    depends_on:
      - backend
    command: python -m http.server 8080

volumes:
  n8n-data: